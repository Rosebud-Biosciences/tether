# The workflows' actions are pinned by commit, so Dependabot is what moves
# them; the lockfile pins every Python dependency the same way, and
# native/rust-toolchain.toml the Rust compiler.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/native"
    schedule:
      interval: "weekly"
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: "rust-toolchain"
    directory: "/native"
    schedule:
      interval: "weekly"
