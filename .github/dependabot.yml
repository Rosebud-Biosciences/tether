# The workflows' actions are pinned by commit, so Dependabot is what moves
# them; the lockfile pins every Python dependency the same way, and
# native/rust-toolchain.toml the Rust compiler.
version: 2

# Every ecosystem waits 7 days after a release before proposing it, so a
# hijacked upstream's malicious version is usually caught and yanked before it
# lands here. Security updates ignore cooldown and still open immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/native"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: "rust-toolchain"
    directory: "/native"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
