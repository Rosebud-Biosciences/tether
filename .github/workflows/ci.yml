name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ty check
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload authenticates with the job's OIDC token
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # Coverage on one leg, with icechunk 2.x (Python 3.12+): under 1.x the
        # store-lifecycle tests and the use-cases story skip. Only 1.x's
        # fallback, for an icechunk without the lifecycle API, goes unmeasured.
        include:
          - python-version: "3.13"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # jj has no official setup action; install the release binary so the
      # jj-parametrized tests run instead of being skipped.
      - name: Install jj
        env:
          JJ_VERSION: v0.45.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/jj.tar.gz -C /tmp ./jj
          sudo install -m 0755 /tmp/jj /usr/local/bin/jj
          jj --version
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: pytest
        if: ${{ !matrix.coverage }}
        run: uv run pytest -n auto
      - name: pytest with coverage
        if: ${{ matrix.coverage }}
        run: uv run pytest -n auto --cov=tether --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Upload coverage
        if: ${{ matrix.coverage }}
        # Pushes to a branch are not "tokenless" uploads (only fork PRs are),
        # so authenticate with the job's OIDC token rather than a stored
        # CODECOV_TOKEN. A failed upload fails the leg: a silently missing
        # report is how the badge stayed blank through every alpha.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: py${{ matrix.python-version }}
          use_oidc: true
          fail_ci_if_error: true
