name: Publish native

# The native scanner (native/) is released on its own: a `native-v<version>`
# release, where <version> is native/pyproject.toml's. tether-vcs releases
# (`v*`) are publish.yml's.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    if: startsWith(github.event.release.tag_name, 'native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, libc: manylinux_2_28 }
          - { runner: ubuntu-latest, target: aarch64, libc: manylinux_2_28 }
          - { runner: ubuntu-latest, target: x86_64, libc: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, libc: musllinux_1_2 }
          - { runner: macos-latest, target: aarch64, libc: macos }
          - { runner: macos-latest, target: x86_64, libc: macos }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc != 'macos' && matrix.libc || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.libc }}-${{ matrix.target }}
          path: native/dist/*.whl

  sdist:
    if: startsWith(github.event.release.tag_name, 'native-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: native/dist/*.tar.gz

  # Every wheel, on the platform it targets, in a fresh environment of
  # tether-vcs, pytest and the wheel: it must carry the license files, be the
  # scanner tether uses, and agree with the Python one. The musl wheels run in
  # Alpine. conftest.py stays out, as it imports test dependencies left out.
  smoke:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, wheel: wheel-manylinux_2_28-x86_64 }
          - { runner: ubuntu-24.04-arm, wheel: wheel-manylinux_2_28-aarch64 }
          - { runner: ubuntu-latest, wheel: wheel-musllinux_1_2-x86_64, alpine: true }
          - { runner: ubuntu-24.04-arm, wheel: wheel-musllinux_1_2-aarch64, alpine: true }
          - { runner: macos-latest, wheel: wheel-macos-aarch64 }
          - { runner: macos-15-intel, wheel: wheel-macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      CHECK: >-
        python -c "import importlib.metadata as m, tether.backends.file as f;
        assert f._native_scanner(), 'tether is not using the wheel';
        names = {p.name for p in m.distribution('tether-vcs-native').files};
        assert {'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES'} <= names, names"
        && python -m pytest -q -p no:cacheprovider --noconftest
        tests/test_native.py tests/test_golden.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel }}
          path: dist
      - name: Install uv
        if: ${{ !matrix.alpine }}
        # No `enable-cache`: setup-uv v10 leaves the cache off for `release`
        # events (a poisoned cache must not reach a published wheel).
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test the wheel
        if: ${{ !matrix.alpine }}
        run: |
          set -euo pipefail
          uv venv --python 3.13
          uv pip install . pytest dist/*.whl
          . .venv/bin/activate
          sh -euc "$CHECK"
      - name: Test the wheel on Alpine
        if: ${{ matrix.alpine }}
        env:
          IMAGE: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/src" --workdir /src "$IMAGE"
          sh -euc "python -m venv /tmp/venv && . /tmp/venv/bin/activate
          && pip install --quiet . pytest dist/*.whl && $CHECK"

  publish:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi-native
    permissions:
      id-token: write # trusted publishing; no long-lived tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Tag matches the package version
        run: |
          set -euo pipefail
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("native/pyproject.toml","rb"))["project"]["version"])')"
          test "native-v${version}" = "${GITHUB_REF_NAME}" || {
            echo "release tag ${GITHUB_REF_NAME} does not match native/pyproject.toml version ${version}" >&2
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        run: uv publish dist/*
