[package]
name = "tether-native"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.83"
description = "The native directory scanner behind tether-vcs's file backend"
license = "Apache-2.0"
publish = false

[lib]
name = "tether_native"
crate-type = ["cdylib", "rlib"]

[features]
# The Python module; maturin turns it on. Without it, `cargo test` builds and
# tests the scanner as plain Rust, with no Python to link against.
python = ["dep:pyo3"]

[dependencies]
blake2 = "0.11"
hex = "0.4"
pyo3 = { version = "0.30", features = ["abi3-py311"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
